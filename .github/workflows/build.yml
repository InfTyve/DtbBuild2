name: Build Kernel
on: [workflow_dispatch]

env:
  KERNEL_REPO: https://github.com/plmzaq2112/dandelion-4.19-purity.git
  KERNEL_BRANCH: 4.19.325-purity
  CLANG_REPO: https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev cpio rsync \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            device-tree-compiler lz4 zstd ccache python3
          df -h /

      - name: Clone kernel
        run: |
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
          cd kernel && git log --oneline -1

      - name: Clone clang
        run: |
          git clone --depth=1 "$CLANG_REPO" clang
          ./clang/bin/clang --version | head -3

      - name: Patch for clang14
        run: |
          cd kernel
          python3 - <<'PY'
          import re

          # 1) 该树的 Makefile 注入了 33 处 -mllvm 调优参数，其中多个是 LLVM 15+ 才有的
          #    （-inline-instr-cost / -inline-call-penalty / -hot-callsite-rel-freq 等）。
          #    clang 14 遇到任何一个都会 fatal: Unknown command line argument。
          #    这些参数只影响内联激进度，对功能零影响，整体移除、保留行结构。
          s = open('Makefile').read()
          n = len(re.findall(r'-mllvm\s+[^\s\\]+', s))
          s = re.sub(r'-mllvm\s+[^\s\\]+', '', s)
          open('Makefile', 'w').write(s)
          print(f'[Makefile] removed {n} -mllvm tokens, remain {len(re.findall(r"-mllvm", s))}')

          # 2) 该树 backport "mipi-dsi: add num_params" 时漏删了旧签名，
          #    include/drm/drm_mipi_dsi.h:291 会出现孤立的 "u16 *brightness);"，
          #    编译 drm_mipi_dsi.o 时直接报 extraneous ')' before ';'。
          p = 'include/drm/drm_mipi_dsi.h'
          src = open(p).read().split('\n')
          out, dropped = [], 0
          for i, l in enumerate(src):
              if re.match(r'^\s*u16 \*brightness\);\s*$', l) and i > 0 and 'size_t num_params);' in src[i-1]:
                  dropped += 1
                  continue
              out.append(l)
          if dropped:
              open(p, 'w').write('\n'.join(out))
          print(f'[drm_mipi_dsi.h] dropped {dropped} stray line(s), now {len(out)} lines')

          # 3) 该树把 mtk_idle_profile.c 的日志缓冲变量 idle_log 重命名为 idle_state_log，
          #    却漏改 75-77 行三个宏。append_log() 展开后引用不存在的 idle_log，
          #    从 322 行起连续报 use of undeclared identifier 'idle_log'。
          #    按实际定义的变量名回填，不写死名字，兼容作者后续再改名。
          p = 'drivers/misc/mediatek/base/power/spm/common/mtk_idle_profile.c'
          src = open(p).read()
          m = re.search(r'static\s+struct\s+mtk_idle_buf\s+(\w+)\s*;', src)
          var = m.group(1) if m else 'idle_log'
          lines = src.split('\n')
          fixed = 0
          for i, l in enumerate(lines):
              if l.lstrip().startswith('#define') and 'idle_log' in l \
                 and re.search(r'\b(reset_log|get_log|append_log)\b', l):
                  new = re.sub(r'\bidle_log\b', var, l)
                  if new != l:
                      lines[i] = new
                      fixed += 1
          if fixed:
              open(p, 'w').write('\n'.join(lines))
          print(f'[mtk_idle_profile.c] retargeted {fixed} macro line(s) -> {var}')
          PY
          # 原厂配置从通用 defconfig 继承了整套 virtio 虚拟机驱动（QEMU/KVM 用）。
          # 真机上无用，且 drivers/gpu/drm/virtio/virtgpu_vq.c:929 在 4.19.325 上
          # 报 "use of undeclared identifier 'nents'"，直接中断 drivers 编译。
          for opt in DRM_VIRTIO_GPU VIRTIO VIRTIO_MENU VIRTIO_BLK VIRTIO_NET VIRTIO_CONSOLE VIRTIO_INPUT VIRTIO_MMIO VIRTIO_MMIO_CMDLINE_DEVICES VIRTIO_VSOCKETS VIRTIO_VSOCKETS_COMMON; do
            sed -i "s/^CONFIG_${opt}=y/# CONFIG_${opt} is not set/" "$GITHUB_WORKSPACE/configs/ekvator.config"
          done
          echo "virtio remaining: $(grep -cE '^CONFIG_(DRM_VIRTIO|VIRTIO)' "$GITHUB_WORKSPACE/configs/ekvator.config" || true)"
          # imgsensor 的 Makefile 把 CONFIG_CUSTOM_KERNEL_IMGSENSOR 里的每一项当目录名用
          # （FILTER_DRV + wildcard），目录不存在也会照样 obj-y += 进去，最终报
          # No rule to make target '.../imgsensor/src/common/v1/ov8858_mipi_raw/'。
          # 原厂的 5 个 sensor 名（ov8858/gc8034/gc5035/gc5025/gc2385）在本树里一个都没有，
          # 换成树内实际存在、且作者 blossom_defconfig 验证过的 14 个。
          sed -i 's|^CONFIG_CUSTOM_KERNEL_IMGSENSOR=.*|CONFIG_CUSTOM_KERNEL_IMGSENSOR="hynix_hi1337_i hynix_hi1337_ii hynix_hi1337_iii hynix_hi1337_iiii hynix_hi556_i gc_gc5035_i gc_gc5035_ii gc_gc5035_iii gc_gc5035_iiii hynix_hi259_i hynix_hi259_ii gc_gc02m1_ii hynix_hi259_iii hynix_hi259_iv"|' "$GITHUB_WORKSPACE/configs/ekvator.config"
          echo "imgsensor: $(grep -oE 'CONFIG_CUSTOM_KERNEL_IMGSENSOR=.*' "$GITHUB_WORKSPACE/configs/ekvator.config" | cut -c1-60)..."
          # fw_log_gps.c 里 #include "connsys_debug_utility.h" 被 #if 0 注释掉，
          # 而 connectivity/common/Makefile 又把 debug_utility/connsys_debug_utility.o
          # 的编译条目整段注释掉（第 270-272 行），实现根本不存在。
          # 光补 include 只会把错误从 fw_log_gps.o 推到 vmlinux 链接阶段，直接关闭该项。
          sed -i 's|^CONFIG_MTK_CONNSYS_DEDICATED_LOG_PATH=y|# CONFIG_MTK_CONNSYS_DEDICATED_LOG_PATH is not set|' "$GITHUB_WORKSPACE/configs/ekvator.config"
          echo "connsys log path: $(grep -E 'CONFIG_MTK_CONNSYS_DEDICATED_LOG_PATH' "$GITHUB_WORKSPACE/configs/ekvator.config")"
          # MT6357 与 MT6359 是两颗不同 PMIC 的同一套驱动（厂商把源码整套复制，
          # 函数名、静态变量名都没改）。MT8768/MT6765 用的是 MT6357：
          #   CONFIG_REGULATOR_MT6357=y / CONFIG_REGULATOR_MT6359 is not set
          # 原厂把 MT6359 那两个驱动造成模块（=m），模块不参与 vmlinux 链接，所以从不冲突。
          # 之前把它们改成 =y 后，两个 .o 同时进 vmlinux，链接器报 44 处
          # "multiple definition of ..."；mt6359-gauge.o 与 mt6357-gauge.o 抢符号。
          # 正确做法是保留原厂的 =m 语义、且明确只内建本机这一颗。
          sed -i 's|^CONFIG_BATTERY_MT6359=y|# CONFIG_BATTERY_MT6359 is not set|' "$GITHUB_WORKSPACE/configs/ekvator.config"
          sed -i 's|^CONFIG_SND_SOC_MT6359_ACCDET=y|# CONFIG_SND_SOC_MT6359_ACCDET is not set|' "$GITHUB_WORKSPACE/configs/ekvator.config"
          echo "gauge: $(grep -E 'CONFIG_BATTERY_MT63' "$GITHUB_WORKSPACE/configs/ekvator.config" | tr '\n' ' ')"
          echo "accdet: $(grep -E 'CONFIG_SND_SOC_MT63.*ACCDET' "$GITHUB_WORKSPACE/configs/ekvator.config" | tr '\n' ' ')"
          # 删掉原厂遗留的链接器类型标记，让 olddefconfig 按实际 LD 重新探测
          sed -i '/^CONFIG_LD_IS_LLD=/d' "$GITHUB_WORKSPACE/configs/ekvator.config"
          sed -i 's/^CONFIG_LTO_CLANG=y/# CONFIG_LTO_CLANG is not set/' "$GITHUB_WORKSPACE/configs/ekvator.config"
          sed -i 's/^CONFIG_POLLY_CLANG=y/# CONFIG_POLLY_CLANG is not set/' "$GITHUB_WORKSPACE/configs/ekvator.config"

      - name: Setup config
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          mkdir -p out
          cp "$GITHUB_WORKSPACE/configs/ekvator.config" out/.config
          make O=out ARCH=arm64 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig > /tmp/olddef.log 2>&1 || { tail -40 /tmp/olddef.log; exit 1; }
          echo "=== 生效后的关键项 ==="
          grep -E 'CONFIG_CUSTOM_KERNEL_LCM|CONFIG_LCM_(WIDTH|HEIGHT)|CONFIG_MTK_PLATFORM|CONFIG_MACH_MT|CONFIG_BATTERY_MT63|CONFIG_SND_SOC_MT63|CONFIG_CC_IS_CLANG|CONFIG_LD_IS_|CONFIG_MTK_LCM_PHYSICAL_ROTATION|CONFIG_VIRTIO|CONFIG_DRM_VIRTIO' out/.config || true
          echo "=== 行数 ==="
          wc -l out/.config

      - name: Build Image
        run: |
          set -o pipefail
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export CCACHE_DIR="$HOME/.ccache"
          LOG="$GITHUB_WORKSPACE/build.log"
          ccache -M 3G > /dev/null || true
          make O=out ARCH=arm64 \
            CC="ccache clang" \
            LLVM_IAS=0 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" \
            -j"$(nproc)" Image 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ] || [ ! -f out/arch/arm64/boot/Image ]; then
            {
              echo
              echo '================ BUILD FAILED ================'
              echo '--- [1] 编译错误 ---'
              grep -nE '(error|fatal error): ' "$LOG" | head -25 || true
              echo '--- [2] 链接错误 ---'
              grep -nE 'undefined (symbol|reference)|multiple definition of|ld\.lld: error|ld: (error|cannot|unrecognized)' "$LOG" | head -30 || true
              echo '--- [3] modpost / 符号表 ---'
              grep -nE '^ERROR: |modpost:' "$LOG" | head -15 || true
              echo '--- [4] 缺目标 / 不支持的参数 ---'
              grep -nE 'No rule to make target|Unknown command line argument|is not a valid' "$LOG" | head -15 || true
              echo '--- [5] 末尾 12 行 ---'
              tail -12 "$LOG"
              echo '============== END OF DIGEST ================'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            # 同时输出为 GitHub 注解，失败时 run 页面顶部直接列出，手机端不用翻日志
            grep -nE '(error|fatal error|undefined symbol|No rule to make target)' "$LOG" \
              | head -10 | tr -d '\r' | cut -c1-300 | while IFS= read -r line; do
                echo "::error::$line"
              done
            exit 1
          fi
          ls -l out/arch/arm64/boot/Image
          ccache -s || true

      - name: Show version
        run: |
          strings kernel/out/arch/arm64/boot/Image | grep -m1 'Linux version' || true

      - name: Pack boot.img
        run: |
          gzip -9 -n -c kernel/out/arch/arm64/boot/Image > Image.gz
          ls -l Image.gz
          python3 scripts/pack_bootimg.py \
            --kernel Image.gz \
            --ramdisk prebuilt/ramdisk.gz \
            --dtb prebuilt/dtb \
            -o boot.img

      - name: Verify boot.img
        run: |
          python3 - <<'PY'
          import struct
          d = open('boot.img','rb').read()
          f = struct.unpack_from('<8s10I', d, 0)
          magic, ksz, kaddr, rsz, raddr, ssz, saddr, taddr, psz, hv, osv = f
          # v2 布局: 1632=recovery_dtbo_size, 1636=dtbo_off(8B), 1644=header_size, 1648=dtb_size
          dtbsz = struct.unpack_from('<I', d, 1648)[0]
          print(f'magic      : {magic}')
          print(f'kernel     : {ksz:>10,} bytes  @ {kaddr:#x}')
          print(f'ramdisk    : {rsz:>10,} bytes  @ {raddr:#x}')
          print(f'dtb        : {dtbsz:>10,} bytes')
          print(f'page_size  : {psz}   header_version: {hv}')
          print(f'total      : {len(d):>10,} bytes  (partition limit 33,554,432)')
          assert magic == b'ANDROID!', 'bad magic'
          assert len(d) <= 32*1024*1024, 'exceeds boot partition'
          assert 1024*1024 < ksz < 32*1024*1024, 'kernel size looks wrong'
          assert dtbsz == 107563, f'dtb size mismatch: {dtbsz}'
          print('OK: boot.img 结构校验通过')
          PY

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload boot image
        uses: actions/upload-artifact@v4
        with:
          name: boot-image
          path: |
            boot.img
            Image.gz
          if-no-files-found: error
          retention-days: 30
